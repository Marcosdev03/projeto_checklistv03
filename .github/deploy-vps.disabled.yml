# Disabled: the production target is Azure Container Apps.
# Kept outside .github/workflows only as a reference for the former VPS deploy.
name: Deploy Checklist (legacy VPS)

on:
  push:
    branches:
      - producao
  workflow_dispatch:

concurrency:
  group: deploy-checklist-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DEPLOY_REPO_DIR: /root/Home/ecosistema/projeto_checklistv03
      DEPLOY_STACK_DIR: /root/Home/ecosistema

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          envs: DEPLOY_REPO_DIR,DEPLOY_STACK_DIR
          script: |
            set -euo pipefail

            if [ ! -d "$DEPLOY_REPO_DIR/.git" ]; then
              echo "Repositório não encontrado em $DEPLOY_REPO_DIR"
              exit 1
            fi

            cd "$DEPLOY_REPO_DIR"
            git fetch origin
            git checkout producao
            git pull --ff-only origin producao

            if [ ! -f "$DEPLOY_STACK_DIR/compose.yml" ] && [ ! -f "$DEPLOY_STACK_DIR/docker-compose.yml" ]; then
              echo "Arquivo compose não encontrado em $DEPLOY_STACK_DIR"
              exit 1
            fi

            cd "$DEPLOY_STACK_DIR"

            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "docker compose não está disponível no servidor"
              exit 1
            fi

            $COMPOSE_CMD up -d --build --remove-orphans

            for i in 1 2 3 4 5 6; do
              curl -fsS https://checklists.tech > /dev/null && break
              if [ "$i" -eq 6 ]; then
                echo "Health check falhou após o deploy"
                $COMPOSE_CMD ps
                $COMPOSE_CMD logs --tail 100
                exit 1
              fi
              sleep 5
            done

            curl -fsS https://checklists.tech > /dev/null
            echo "Deploy do checklist concluido com sucesso."
