name: Manage pgAdmin access

on:
  push:
    branches:
      - producao
    paths:
      - .github/workflows/admin-pgadmin.yml
  workflow_dispatch:
    inputs:
      allowed_ip:
        description: Public IPv4 address allowed to access pgAdmin
        required: true
        default: 45.178.251.100
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: manage-pgadmin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CHECKLISTSPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHECKLISTSPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHECKLISTSPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Create or update pgAdmin
        env:
          ALLOWED_IP: ${{ inputs.allowed_ip || '45.178.251.100' }}
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$ALLOWED_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error title=Invalid IP::Use a single public IPv4 address."
            exit 1
          fi

          az extension add \
            --name containerapp \
            --upgrade \
            --allow-preview true

          environment_id="$(az containerapp show \
            --name checklists-prod \
            --resource-group rg-checklists-prod \
            --query properties.environmentId \
            --output tsv)"

          if ! az containerapp show \
            --name pgadmin-lojatech \
            --resource-group rg-checklists-prod \
            >/dev/null 2>&1; then
            password="$(openssl rand -base64 36 | tr -d '\n')"

            az containerapp create \
              --name pgadmin-lojatech \
              --resource-group rg-checklists-prod \
              --environment "$environment_id" \
              --image dpage/pgadmin4:latest \
              --ingress external \
              --target-port 80 \
              --transport auto \
              --cpu 0.5 \
              --memory 1Gi \
              --min-replicas 1 \
              --max-replicas 1 \
              --secrets "pgadmin-password=$password" \
              --env-vars \
                "PGADMIN_DEFAULT_EMAIL=sdfreitas7@gmail.com" \
                "PGADMIN_DEFAULT_PASSWORD=secretref:pgadmin-password" \
                "PGADMIN_DISABLE_POSTFIX=1"
          fi

          existing_rules="$(az containerapp ingress access-restriction list \
            --name pgadmin-lojatech \
            --resource-group rg-checklists-prod \
            --query "[].name" \
            --output tsv)"

          while IFS= read -r rule; do
            if [ -n "$rule" ] && [ "$rule" != "home-ip" ]; then
              az containerapp ingress access-restriction remove \
                --name pgadmin-lojatech \
                --resource-group rg-checklists-prod \
                --rule-name "$rule"
            fi
          done <<< "$existing_rules"

          az containerapp ingress access-restriction set \
            --name pgadmin-lojatech \
            --resource-group rg-checklists-prod \
            --rule-name home-ip \
            --description "Marcos home public IP" \
            --ip-address "$ALLOWED_IP/32" \
            --action Allow

          fqdn="$(az containerapp show \
            --name pgadmin-lojatech \
            --resource-group rg-checklists-prod \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          echo "::notice title=pgAdmin URL::https://$fqdn"
          echo "pgAdmin restricted to $ALLOWED_IP/32"

      - name: Verify restriction and revision
        if: always()
        shell: bash
        run: |
          set +e

          az containerapp ingress access-restriction list \
            --name pgadmin-lojatech \
            --resource-group rg-checklists-prod \
            --output table

          az containerapp revision list \
            --name pgadmin-lojatech \
            --resource-group rg-checklists-prod \
            --output table

          latest_revision="$(az containerapp revision list \
            --name pgadmin-lojatech \
            --resource-group rg-checklists-prod \
            --query "sort_by(@, &properties.createdTime)[-1].name" \
            --output tsv)"

          state="$(az containerapp revision show \
            --name pgadmin-lojatech \
            --resource-group rg-checklists-prod \
            --revision "$latest_revision" \
            --query "{name:name,health:properties.healthState,running:properties.runningState,provisioning:properties.provisioningState,error:properties.provisioningError,replicas:properties.replicas}" \
            --output json 2>&1)"

          logs="$(timeout 30s az containerapp logs show \
            --name pgadmin-lojatech \
            --resource-group rg-checklists-prod \
            --revision "$latest_revision" \
            --type console \
            --tail 50 2>&1)"

          state="${state//'%'/'%25'}"
          state="${state//$'\r'/'%0D'}"
          state="${state//$'\n'/'%0A'}"
          logs="${logs//'%'/'%25'}"
          logs="${logs//$'\r'/'%0D'}"
          logs="${logs//$'\n'/'%0A'}"

          echo "::notice title=pgAdmin revision::$state"
          echo "::warning title=pgAdmin console::$logs"
