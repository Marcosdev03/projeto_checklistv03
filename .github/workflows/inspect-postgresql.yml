name: Inspect PostgreSQL infrastructure

on:
  push:
    branches:
      - producao
    paths:
      - .github/workflows/inspect-postgresql.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CHECKLISTSPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHECKLISTSPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHECKLISTSPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Inspect current PostgreSQL server
        shell: bash
        run: |
          set -euo pipefail

          server="$(az postgres flexible-server show \
            --name psql-lojatech-prod \
            --resource-group rg-lojatech-prod \
            --query "{name:name,version:version,location:location,sku:sku.name,tier:sku.tier,storage:storage.storageSizeGb,backupDays:backup.backupRetentionDays,geoBackup:backup.geoRedundantBackup,ha:highAvailability.mode,network:network.publicNetworkAccess,state:state}" \
            --output json)"

          databases="$(az postgres flexible-server db list \
            --server-name psql-lojatech-prod \
            --resource-group rg-lojatech-prod \
            --query "[].{name:name,charset:charset,collation:collation}" \
            --output json)"

          server="${server//'%'/'%25'}"
          server="${server//$'\r'/'%0D'}"
          server="${server//$'\n'/'%0A'}"
          databases="${databases//'%'/'%25'}"
          databases="${databases//$'\r'/'%0D'}"
          databases="${databases//$'\n'/'%0A'}"

          echo "::notice title=PostgreSQL server::$server"
          echo "::notice title=PostgreSQL databases::$databases"
