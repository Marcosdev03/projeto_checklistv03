name: Deploy to Azure Container Apps

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-checklists-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CHECKLISTSPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHECKLISTSPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHECKLISTSPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: acrlojatechprod.azurecr.io
          registryUsername: ${{ secrets.CHECKLISTSPROD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CHECKLISTSPROD_REGISTRY_PASSWORD }}
          imageToBuild: acrlojatechprod.azurecr.io/checklists-prod:${{ github.sha }}
          containerAppName: checklists-prod
          resourceGroup: rg-checklists-prod
          targetPort: 8000
          ingress: external
