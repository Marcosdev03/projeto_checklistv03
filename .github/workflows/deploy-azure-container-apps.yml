name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - producao
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-checklists-prod
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY_SERVER: acrlojatechprod-a8b7ctgnajcveccq.azurecr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CHECKLISTSPROD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CHECKLISTSPROD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CHECKLISTSPROD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        env:
          REGISTRY_USERNAME: ${{ secrets.CHECKLISTSPROD_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CHECKLISTSPROD_REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          image="$REGISTRY_SERVER/checklists-prod:$IMAGE_TAG"
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY_SERVER" \
            --username "$REGISTRY_USERNAME" \
            --password-stdin
          docker build --file Dockerfile --tag "$image" .
          docker push "$image"

      - name: Deploy image to Container App
        env:
          REGISTRY_USERNAME: ${{ secrets.CHECKLISTSPROD_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CHECKLISTSPROD_REGISTRY_PASSWORD }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          image="$REGISTRY_SERVER/checklists-prod:$IMAGE_TAG"
          az extension add --name containerapp --upgrade --allow-preview true
          az containerapp registry set \
            --name checklists-prod \
            --resource-group rg-checklists-prod \
            --server "$REGISTRY_SERVER" \
            --username "$REGISTRY_USERNAME" \
            --password "$REGISTRY_PASSWORD"
          az containerapp update \
            --name checklists-prod \
            --resource-group rg-checklists-prod \
            --image "$image"

      - name: Verify application health
        shell: bash
        run: |
          app_url="https://$(az containerapp show \
            --name checklists-prod \
            --resource-group rg-checklists-prod \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              "$app_url/health/" | grep --quiet '"healthy"'; then
              echo "Checklist saudável em $app_url"
              exit 0
            fi

            echo "Aguardando o Checklist iniciar ($attempt/36)..."
            sleep 10
          done

          az containerapp revision list \
            --name checklists-prod \
            --resource-group rg-checklists-prod \
            --output table
          az containerapp logs show \
            --name checklists-prod \
            --resource-group rg-checklists-prod \
            --type system \
            --tail 100 || true
          az containerapp logs show \
            --name checklists-prod \
            --resource-group rg-checklists-prod \
            --type console \
            --tail 100 || true
          exit 1
