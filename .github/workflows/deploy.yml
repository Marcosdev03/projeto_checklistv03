name: Deploy Checklist

on:
  push:
    branches:
      - producao
  workflow_dispatch:

concurrency:
  group: deploy-checklist-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script: |
            set -e
            cd /root/Home/ecosistema/projeto_checklistv03
            git fetch origin
            git checkout producao
            git pull --ff-only origin producao

            cd /root/Home/ecosistema
            docker compose up -d --build checklists-backend checklists-app

            curl -fsS https://checklists.tech > /dev/null
            echo "Deploy do checklist concluido com sucesso."
