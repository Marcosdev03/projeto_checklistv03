services:
    frontend:
        container_name: frontend
        env_file:
            - .env
        build:
            context: ./frontend
        networks:
            - network
        ports:
            - "${PORT_APP}:80"
        depends_on:
            - backend
    backend:
        container_name: backend
        env_file:
            - .env
        build:
            context: ./backend
        networks:
          - network
        entrypoint: /app/entrypoint.sh
        command: python manage.py runserver 0.0.0.0:8000
        depends_on:
            - database
    database:
        image: postgres:14-alpine
        networks:
          - network
        container_name: database
        env_file:
            - .env
        volumes:
            - postgres_data:/var/lib/postgresql/data/

volumes:
    postgres_data:

networks:
    network:
        driver: bridge
