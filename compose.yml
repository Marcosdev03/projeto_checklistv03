services:
  backend:
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    build:
      context: ./backend
    entrypoint: /app/entrypoint.sh
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

